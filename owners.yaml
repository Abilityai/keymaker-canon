# owners.yaml - the routing map. One kind of work, one owner agent, one person behind it.
# The orchestrator reads this before every route and never invents an owner.
# `agent` is the name on your Trinity instance - edit it if yours differ.
version: 1
steward: orchestrator          # keeps the map true (reports drift); people change it by PR
work:
  - kind: leads
    description: Inbound interest before a conversation has been agreed - forms, replies, referrals
    agent: marketing-agent
    person: marketing lead
    playbooks: [weekly-report, content-plan]
    writes: marketing/leads.yaml, reports/lead-<slug>.md
    hands_to: deals            # a lead becomes a deal when a real person asks for a conversation

  - kind: deals
    description: A named company we are selling to, from Discovery Call Booked to Won
    agent: sales-agent
    person: the deal owner (a rep), or the principal
    playbooks: [deal, draft-outreach]
    writes: pipeline/deals.yaml, drafts/*.md
    hands_to: client-projects  # on Won, Sales writes drafts/<slug>-handoff.md

  - kind: pricing
    description: The price list and any price off it
    agent: null                # no agent writes prices; the list is canon/pricing.md
    person: principal
    reads: [sales-agent, orchestrator]

  - kind: client-projects
    description: Clients after signature - health, implementations, stalls, post-mortems
    agent: delivery-agent
    person: delivery manager
    playbooks: [clients, client-status]
    writes: clients/clients.yaml, clients/postmortems/*.md

  - kind: call-notes
    description: Transcripts turned into decisions, action items and a client summary
    agent: meeting-notes-bot
    person: delivery manager
    playbooks: [summarize, process-inbox]
    writes: notes/*.md

  - kind: lessons-and-judgment
    description: What the agency has learned, and advice grounded in it
    agent: cornelius
    person: principal (graduates notes; the brain commands no one)
    playbooks: [advise, recall, decide, extract-insights]
    writes: its own vault only

  - kind: routing-and-receipts
    description: Who owns what, what is in flight, what waits on a person
    agent: orchestrator
    person: principal
    playbooks: [route, status, escalate, canon-change, map, open-loops]
    writes: ledger/*  (its own ledger only - never a desk's files, never the canon)

# Where a request goes when no line above matches: to the principal, as a question, once.
unmatched: ask the principal
