# system.yaml - the whole Keymaker agency as one Trinity SystemManifest.
# `deploy_system` creates the agents as keymaker-<name> on a FRESH instance (1.0 release candidate
# or later). On an instance that already runs the desks under other names, do not deploy this -
# you would get a second set, including a second brain; grant the orchestrator its edges on the
# Access tab instead.
# Edges are explicit (not the orchestrator-workers preset, which would clear the desks' own
# edges to the brain). `reports-to-*` and `dept-*` tags are human-only: a manifest may not set
# them - add `reports-to-orchestrator` to each desk on the Tags panel after deploy, and the
# Network view draws the org chart.
name: keymaker
description: Keymaker - a fictional automation agency. Four desks, one brain, one orchestrator.
agents:
  orchestrator:
    template: github:Abilityai/keymaker-orchestrator
    folders: {expose: true, consume: true}
    tags: [keymaker]
  sales:
    template: github:Abilityai/keymaker-sales
    folders: {expose: true, consume: true}
    tags: [keymaker]
  delivery:
    template: github:Abilityai/keymaker-delivery
    folders: {expose: true, consume: true}
    tags: [keymaker]
  marketing:
    template: github:Abilityai/keymaker-marketing
    folders: {expose: true, consume: true}
    tags: [keymaker]
  notes:
    template: github:Abilityai/keymaker-meeting-notes-bot
    folders: {expose: true, consume: true}
    tags: [keymaker]
  cornelius:
    template: github:Abilityai/cornelius
    resources: {cpu: "2", memory: "4g"}
    folders: {expose: true, consume: true}
    tags: [keymaker]
permissions:
  explicit:
    orchestrator: [sales, delivery, marketing, notes, cornelius]
    sales: [delivery, marketing, notes, cornelius]
    delivery: [sales, marketing, cornelius]
    marketing: [sales, delivery, cornelius]
    notes: [sales, delivery, marketing, cornelius]
    cornelius: [sales, delivery, marketing]
# After deploy: edit owners.yaml so `agent:` carries the keymaker-<name> names this manifest
# creates, and run /first-run on the brain.
