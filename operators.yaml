# operators.yaml - the people. Who operates which desk, who approves what, with limits.
# An approval raised to "someone" is refused; every gate names a role here and an expiry.
version: 1
people:
  - id: principal
    name: "Eugene Vyborov"
    email: "eugene@ability.ai"        # the admin of the Keymaker instance
    role: principal                   # sees everything; the only signer; approves prices off the list
    operates: [orchestrator, sales-agent, cornelius]
  - id: sam
    name: "Sam Reyes"
    email: "sam@keymaker.agency"
    role: rep                         # works the deals they own; may give the standard discount
    operates: [sales-agent]
  - id: noor
    name: "Noor Haddad"
    email: "noor@keymaker.agency"
    role: delivery-manager
    operates: [delivery-agent, meeting-notes-bot]
  - id: theo
    name: "Theo Lindqvist"
    email: "theo@keymaker.agency"
    role: marketing-lead
    operates: [marketing-agent]

# Who approves what. `limit` is the line below which the role may decide alone.
approvals:
  - action: discount on a Pilot or a Build
    decides_alone: rep                # up to the limit, as an invoice credit, never a rate cut
    limit: "10% of the list price"
    above_limit: principal
    expires_after: "3 business days"
  - action: any discount on the Automation audit
    decides_alone: nobody             # the price list says no discounts on the audit
    above_limit: principal
  - action: a new price, or a change to pricing.md
    decides_alone: nobody
    above_limit: principal            # by PR to this repo; the orchestrator only prepares it
  - action: send anything to a client (email, proposal, contract)
    decides_alone: the deal owner     # a person presses send; agents only draft
  - action: change a client's state or an implementation's state
    decides_alone: delivery-manager
  - action: publish anything under the agency's name
    decides_alone: marketing-lead
  - action: graduate a note in the brain (ai-inferred -> endorsed)
    decides_alone: principal
  - action: grant an agent permission to call another agent
    decides_alone: principal          # on the Access tab; no agent can grant an edge

# Which escalations interrupt a person now, and which wait for the morning brief.
escalation:
  now: [money above a rep's limit, a client at risk of leaving, anything irreversible, a security question]
  brief: [everything else]
  rule: one ask per decision, with the options and a deadline; then the agent ends its turn and waits
