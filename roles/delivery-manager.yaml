  statement: 'A post-mortem goes to the brain as a lesson.'
  decision_rights: executes
  human: 'Writes the post-mortem.'
  agent: 'delivery-agent sends it to the brain with /extract-insights.'
  metrics: []
  consulted: []
  informed: [principal]
inputs: [deals, call-notes, lessons-and-judgment]
outputs: [client-projects]
